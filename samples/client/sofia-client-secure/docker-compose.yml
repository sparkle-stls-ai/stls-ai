version: "3.9"

# ── sofia-client-secure local stack ───────────────────────────────────────────
#
# Starts:
#   • postgres   — shared DB (agents config, sessions, access control)
#   • redis      — task-store + auth-key cache used by the stls-a2a agents
#   • app        — Node.js Express + Python secure transport (single container)
#
# Usage:
#   docker compose up --build
#
# The app container runs docker-entrypoint.sh which starts the Python
# secure transport service first, waits for it to be healthy, then starts
# the Express server.
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sofia
      POSTGRES_USER: spk_sofia
      POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spk_sofia -d sofia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      args:
        VITE_MODE: production
        VITE_AUTH_MODE: "${VITE_AUTH_MODE:-none}"
        LIBOQS_VERSION: "${LIBOQS_VERSION:-0.14.0}"
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # ── Node / Express ────────────────────────────────────────────────────
      PORT: 8080
      NODE_ENV: production
      VITE_MODE: production
      VITE_AUTH_MODE: "${VITE_AUTH_MODE:-none}"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-in-production}"
      SESSION_TIMEOUT_MINUTES: "${SESSION_TIMEOUT_MINUTES:-30}"
      # Origins allowed to embed the app in an <iframe> (CSP frame-ancestors).
      # Empty = no restriction. See server/src/middleware/securityHeaders.ts.
      FRAME_ANCESTORS: "${FRAME_ANCESTORS:-}"

      # ── Database ──────────────────────────────────────────────────────────
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sofia
      DB_USER: spk_sofia
      DB_PASSWORD: CHANGE_ME_STRONG_PASSWORD

      # ── Secure transport (Python service inside same container) ───────────
      SECURE_TRANSPORT_URL: http://localhost:8090
      SECURE_TRANSPORT_PORT: 8090
      SECURE_TRANSPORT_HOST: 0.0.0.0

      # ── Key session provider ──────────────────────────────────────────────
      KEY_SESSION_PORT: "${KEY_SESSION_PORT:-8081}"
      KEY_SESSION_HOST: "${KEY_SESSION_HOST:-localhost}"
      KEY_PROVIDER_NAME: "${KEY_PROVIDER_NAME:-base}"

      # ── Key session store ───────────────────────────────────────────────────
      # secure_transport.py persists key sessions using the same SESSION_CACHE_*
      # convention as the server-side stls_core.SessionCacheFactory. Defaults to
      # redis here (unlike the memory default elsewhere) since the `redis`
      # service above is already provisioned in this stack.
      SESSION_CACHE_BACKEND: "${SESSION_CACHE_BACKEND:-redis}"
      SESSION_CACHE_REDIS_URL: "${SESSION_CACHE_REDIS_URL:-redis://redis:6379}"
      SESSION_CACHE_REDIS_NAMESPACE: "${SESSION_CACHE_REDIS_NAMESPACE:-stls:sc}"
      SESSION_CACHE_TTL: "${SESSION_CACHE_TTL:-3600}"

      # ── Suggestion chips (Gemini) ─────────────────────────────────────────
      GOOGLE_GENAI_USE_VERTEXAI: "${GOOGLE_GENAI_USE_VERTEXAI:-false}"
      GOOGLE_CLOUD_PROJECT: "${GOOGLE_CLOUD_PROJECT:-}"
      GOOGLE_CLOUD_LOCATION: "${GOOGLE_CLOUD_LOCATION:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      SUGGESTIONS_MODEL: "${SUGGESTIONS_MODEL:-gemini-3.5-flash}"

      # ── Optional: Arqit JVM classpath ─────────────────────────────────────
      # CLASSPATH: /app/stls-ai.jar

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
