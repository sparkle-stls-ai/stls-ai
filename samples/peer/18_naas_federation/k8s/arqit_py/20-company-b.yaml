# company-b, arqit_py pass. b-seller: 2 replicas, ONE
# ARQIT_PY_DEVICE_ROLE=consumer sidecar (ab-rfq-server) -- no device
# Secret mounted at all here, a consumer sidecar never reads
# ARQIT_PY_SERVER_CONFIG, it resolves the session purely from Redis via
# hint_kid (see ../06-company-b-device-agent.yaml). b-reply-agent:
# singleton, owns the ab-reply-client device directly (owner mode,
# real device Secret mounted via the initContainer pattern -- see
# 06-company-b-device-agent.yaml's own comment for why).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: b-seller
  namespace: naas-company-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: b-seller
  template:
    metadata:
      labels:
        app: b-seller
    spec:
      volumes:
        - name: sockets
          emptyDir: {}
      containers:
        - name: b-seller
          image: naas18-app:dev
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "seller.ts"]
          volumeMounts:
            - { name: sockets, mountPath: /sockets }
          env:
            - { name: COMPANY_NAME, value: "company-b" }
            - { name: PORT, value: "8604" }
            - { name: KEY_PROVIDER_NAME, value: "arqit_py" }
            - { name: SOURCES_COUNT, value: "1" }
            - { name: SOURCE_1_NAME, value: "company-a" }
            - { name: SOURCE_1_REPLY_URL, value: "http://192.168.49.2:30601" }
            - { name: SOURCE_1_SOCKET_SERVER, value: "/sockets/ab-rfq-server.sock" }
            - { name: SOURCE_1_TOKEN_SERVER, value: "b-ab-rfq-server-token" }
            - { name: REPLY_MODE, value: "delegate" }
            - { name: REPLY_AGENT_URL, value: "http://b-reply-agent:8605" }
            - { name: SESSION_CACHE_BACKEND, value: "redis" }
            - { name: SESSION_CACHE_REDIS_URL, value: "redis://redis:6379" }
            - { name: CRASH_LOG_PATH, value: "/sockets/crash.log" }
          ports:
            - containerPort: 8604
        - name: sidecar-ab-rfq-server-consumer
          image: naas18-sidecar:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "arqit_sidecar.py", "--socket", "/sockets/ab-rfq-server.sock", "--token", "b-ab-rfq-server-token"]
          volumeMounts:
            - { name: sockets, mountPath: /sockets }
          env:
            - { name: KEY_PROVIDER_NAME, value: "arqit_py" }
            - { name: ARQIT_PY_DEVICE_ROLE, value: "consumer" }
            - { name: KEY_STORE_BACKEND, value: "redis" }
            - { name: KEY_STORE_REDIS_URL, value: "redis://redis:6379" }
            - { name: KEY_STORE_REDIS_NAMESPACE, value: "p18-ab-rfq" }
---
apiVersion: v1
kind: Service
metadata:
  name: b-seller
  namespace: naas-company-b
spec:
  type: NodePort
  selector:
    app: b-seller
  ports:
    - port: 8604
      targetPort: 8604
      nodePort: 30604
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: b-reply-agent
  namespace: naas-company-b
spec:
  replicas: 1
  # Recreate, not RollingUpdate -- same owner-lock deadlock reasoning
  # as 06-company-b-device-agent.yaml (this process owns the
  # ab-reply-client device exclusively).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: b-reply-agent
  template:
    metadata:
      labels:
        app: b-reply-agent
    spec:
      volumes:
        - name: sockets
          emptyDir: {}
        - name: devices-secret
          secret:
            secretName: p18-devices-b
        - name: devices
          persistentVolumeClaim:
            claimName: p18-b-reply-agent-pvc
      initContainers:
        - name: copy-devices
          image: naas18-sidecar:dev
          imagePullPolicy: IfNotPresent
          # Only seed from the Secret on true first use -- a PVC
          # survives pod recreation and carries forward the device's
          # own rotated ratchet state; re-seeding from the (unrotated)
          # Secret on every restart is what caused this sample's own
          # earlier device-bricking pattern. See 02-device-storage.yaml.
          # Checks for THIS device's own config specifically, not "any
          # json file" -- see 06-company-b-device-agent.yaml's comment
          # for why a generic check is wrong (this PVC/Secret also
          # carries company-b's OTHER device's files).
          command: ["sh", "-c", "test -f /devices/aq-sf-p18-ab-reply-client.json || cp /devices-secret/* /devices/"]
          volumeMounts:
            - { name: devices-secret, mountPath: /devices-secret }
            - { name: devices, mountPath: /devices }
      containers:
        - name: b-reply-agent
          image: naas18-app:dev
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "reply_agent.ts"]
          volumeMounts:
            - { name: sockets, mountPath: /sockets }
          env:
            - { name: COMPANY_NAME, value: "company-b" }
            - { name: PORT, value: "8605" }
            - { name: KEY_PROVIDER_NAME, value: "arqit_py" }
            # getTransport() (used by sendReply()) has no per-call token
            # override -- only one CLIENT sidecar here, so this is
            # simply that sidecar's own token.
            - { name: ARQIT_SIDECAR_TOKEN, value: "b-ab-reply-client-token" }
            - { name: TARGETS_COUNT, value: "1" }
            - { name: TARGET_1_NAME, value: "company-a" }
            - { name: TARGET_1_REPLY_URL, value: "http://192.168.49.2:30601" }
            - { name: TARGET_1_SOCKET_CLIENT, value: "/sockets/ab-reply-client.sock" }
            - { name: TARGET_1_TOKEN_CLIENT, value: "b-ab-reply-client-token" }
            - { name: CRASH_LOG_PATH, value: "/sockets/crash.log" }
          ports:
            - containerPort: 8605
        - name: sidecar-ab-reply-client
          image: naas18-sidecar:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "arqit_sidecar.py", "--socket", "/sockets/ab-reply-client.sock", "--token", "b-ab-reply-client-token"]
          volumeMounts:
            - { name: sockets, mountPath: /sockets }
            - { name: devices, mountPath: /home/anton/VSProjects/stls-ai/samples/peer/18_naas_federation/devices }
          env:
            - { name: KEY_PROVIDER_NAME, value: "arqit_py" }
            - { name: ARQIT_PY_CLIENT_CONFIG, value: "/home/anton/VSProjects/stls-ai/samples/peer/18_naas_federation/devices/aq-sf-p18-ab-reply-client.json" }
---
apiVersion: v1
kind: Service
metadata:
  name: b-reply-agent
  namespace: naas-company-b
spec:
  type: ClusterIP
  selector:
    app: b-reply-agent
  ports:
    - port: 8605
      targetPort: 8605
