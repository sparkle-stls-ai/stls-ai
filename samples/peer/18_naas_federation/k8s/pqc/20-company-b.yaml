# company-b: seller only, 2 replicas (the actual subject of issue #38
# -- with `pqc` this is only an infrastructure/wiring check, since pqc
# has no cross-replica state at all; the real device-agent/consumer
# split only matters once arqit_py + Redis are added in a later step).
# REPLY_MODE=delegate: these replicas own no CLIENT-role device/channel
# setup of their own -- replying is delegated to the singleton
# b-reply-agent below (see reply_agent.ts's own header comment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: b-seller
  namespace: naas-company-b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: b-seller
  template:
    metadata:
      labels:
        app: b-seller
    spec:
      containers:
        - name: b-seller
          image: naas18-app:dev
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "seller.ts"]
          env:
            - { name: COMPANY_NAME, value: "company-b" }
            - { name: PORT, value: "8604" }
            - { name: KEY_PROVIDER_NAME, value: "pqc" }
            - { name: SOURCES_COUNT, value: "1" }
            - { name: SOURCE_1_NAME, value: "company-a" }
            - { name: SOURCE_1_REPLY_URL, value: "http://192.168.49.2:30601" }
            - { name: REPLY_MODE, value: "delegate" }
            - { name: REPLY_AGENT_URL, value: "http://b-reply-agent:8605" }
            # Shared SessionCache across replicas -- see 05-redis.yaml's
            # comment for why this is needed (separate from issue #38's
            # own key-store Redis).
            - { name: SESSION_CACHE_BACKEND, value: "redis" }
            - { name: SESSION_CACHE_REDIS_URL, value: "redis://redis:6379" }
          ports:
            - containerPort: 8604
---
apiVersion: v1
kind: Service
metadata:
  name: b-seller
  namespace: naas-company-b
spec:
  type: NodePort
  selector:
    app: b-seller
  ports:
    - port: 8604
      targetPort: 8604
      nodePort: 30604
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: b-reply-agent
  namespace: naas-company-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: b-reply-agent
  template:
    metadata:
      labels:
        app: b-reply-agent
    spec:
      containers:
        - name: b-reply-agent
          image: naas18-app:dev
          imagePullPolicy: IfNotPresent
          command: ["npx", "tsx", "reply_agent.ts"]
          env:
            # Must present itself as "company-b" (the seller's own
            # logical identity), NOT a reply-agent-specific name --
            # the buyer's TARGET_<i>_NAME is "company-b", matching the
            # /from/company-b/... path this process's own handshake uses.
            - { name: COMPANY_NAME, value: "company-b" }
            - { name: PORT, value: "8605" }
            - { name: KEY_PROVIDER_NAME, value: "pqc" }
            - { name: TARGETS_COUNT, value: "1" }
            - { name: TARGET_1_NAME, value: "company-a" }
            - { name: TARGET_1_REPLY_URL, value: "http://192.168.49.2:30601" }
          ports:
            - containerPort: 8605
---
apiVersion: v1
kind: Service
metadata:
  name: b-reply-agent
  namespace: naas-company-b
spec:
  type: ClusterIP
  selector:
    app: b-reply-agent
  ports:
    - port: 8605
      targetPort: 8605
