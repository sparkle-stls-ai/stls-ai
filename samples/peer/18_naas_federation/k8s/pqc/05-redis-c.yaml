# Redis for company-c's own namespace -- same rationale as
# pqc/05-redis.yaml (company-b's own copy): shared SessionCache across
# c-seller's 2 replicas, plus (once arqit_py is layered in) issue
# #38's own key-store Redis, different key prefix, same instance.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: naas-company-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: naas-company-c
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
