[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stls_mcp"
version = "0.1.2"
description = "STLS extension of the Model Context Protocol — transparent application-layer symmetric encryption over Streamable HTTP, sharing the stls-core crypto/session/handshake/provider/auth layer with stls-a2a"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    # Cryptography, session cache, handshake, key provider (base/arqit_py) and
    # API key auth — shared with stls-a2a. Resolved as a local package
    # of the monorepo via [tool.uv.sources] below.
    "stls_core>=0.1.1",
    # Official MCP SDK — FastMCP + Streamable HTTP transport.
    # <2 upper bound to stay compatible until the stable v2 release
    # (beta expected 2026-06-30, stable 2026-07-27).
    "mcp>=1.27,<2",
    # Server-side ASGI middleware for /mcp-stls (alongside the standard
    # FastMCP app mounted on /mcp, generated and managed entirely by the SDK).
    "starlette>=0.40.0",
    "uvicorn>=0.40.0",
    # Client-side: custom httpx.AsyncBaseTransport for streamablehttp_client.
    "httpx>=0.28.1",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]

# Redis cache for ApiKeyManager — pass-through to stls-core.
redis = [
    "stls_core[redis]",
]

# Arqit SKA-Platform™ Python SDK — pass-through to stls-core.
# Install:
#   uv pip install -e ".[arqit_py]" \
#     --find-links arqit_wheels/arqit-skaplatform-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-policy/ \
#     --find-links arqit_wheels/arqit-skaplatform-registration/ \
#     --find-links arqit_wheels/arqit-skaplatform-provisioning/ \
#     --find-links arqit_wheels/arqit-skaplatform-mqtt-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-peering/ \
#     --find-links arqit_wheels/arqit-skaplatform-monitoring/
arqit_py = [
    "stls_core[arqit_py]",
]

# PQC provider — hybrid X25519 + ML-KEM-768. Pass-through to stls-core[pqc].
# Install: uv pip install -e ".[pqc]"
pqc = [
    "stls_core[pqc]",
]

# PostgresLoader (stls_core.auth) — AUTH_LOADER_BACKEND=postgres backend
# for ApiKeyManager (see vault_server.py build_api_key_manager()).
# Pass-through to stls-core[postgres]. Without this extra, the lazy import
# of asyncpg inside PostgresLoader.load_all()/load_one() means the error
# only surfaces on first real use (AUTH_ENABLED=true + AUTH_LOADER_BACKEND=postgres),
# not at process startup with a different backend.
# Install: uv pip install -e ".[postgres]"
postgres = [
    "stls_core[postgres]",
]

# ADK client-side — STLSMCPToolset / create_stls_mcp_toolset
# (stls_mcp_secure_toolset.py). Lazy import of google-adk, inside
# STLSMCPToolset.__new__: without this extra, `import stls_mcp` still
# works fine (server-side use, e.g. vault_server.py) — the error only
# surfaces when instantiating STLSMCPToolset without google-adk installed.
# Same version constraint as stls-a2a: google-adk 2.x introduces a
# breaking change in the async runner (GeneratorExit / OpenTelemetry
# context detach) — see stls-a2a pyproject.toml's notes.
# Install: uv pip install -e ".[adk]"
adk = [
    "google-adk>=1.25.0,<2.0.0",
]

# Development and test dependencies.
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Resolves stls_core as a local package of the monorepo (path relative to
# this pyproject.toml). In production, replace with the version published
# on a private index and remove this section.
[tool.uv.sources]
stls_core = { path = "../stls-core" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src/stls_mcp"]
omit = ["tests/*"]