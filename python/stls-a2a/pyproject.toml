[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stls_a2a"
version = "0.1.14"
description = "SDK for building Agentic A2A comunication using quantum-safe encrypted channels"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    # Cryptography, session cache, handshake, key provider (base/arqit_py) and
    # API key auth now live in stls-core — shared with stls-mcp.
    # Resolved as a local package via [tool.uv.sources] below.
    # >=0.1.9: widened handshake proof binding session_id/kid/protocol/
    # algorithm fields under a dedicated derived key (issue #36) — a
    # breaking wire change, so this floor keeps a published install from
    # pairing with a pre-fix stls_core.
    "stls_core>=0.1.9",
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    # jwt==1.3.1 required by arqit-skaplatform-common and provisioning (JWT class).
    # PyJWT>=2.x required by mcp/msal (ADK transitive dependency, pulled in
    # via the google-adk extra below, not by this package's own code) —
    # kept mandatory here anyway since it's also used directly by the
    # arqit/provisioning path. Both must coexist: whichever jwt is
    # installed last wins on the jwt module.
    # >=2.15.1 (issue #65): the 2.8.0 floor this used to carry was
    # vulnerable to a long string of real CVEs fixed across 2.12.0-2.15.0
    # (header `crit` bypass, JWK endpoint SSRF/DoS, signature verification
    # issues) — 2.15.1 has zero reported vulnerabilities as of this audit.
    "jwt==1.3.1",
    "PyJWT>=2.15.1,<3.0.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.1",
    # Unconditional module-level import in stls_a2a_task.py (TaskStore),
    # used regardless of the chosen backend (TASK_STORE_BACKEND=memory|redis).
    # Without this entry "import stls_a2a" always fails on a clean venv,
    # even if the Redis backend is never used.
    "redis>=5.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
examples = [
    "yfinance>=1.2.0",
]

# Install:  uv pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

# Redis cache for ApiKeyManager (RedisKeyCache, BackgroundRefresher) and
# PostgresLoader. Pass-through to stls-core's extra of the same name.
# Install:  uv pip install -e ".[redis]"
redis = [
    "stls_core[redis]",
]

# Arqit SKA-Platform™ Python SDK (local wheels in arqit_wheels/).
# Pass-through to stls-core's extra of the same name — the arqit_py
# provider lives entirely in stls-core, this just propagates the extra.
# Install:
#   uv pip install -e ".[arqit_py]" \
#     --find-links arqit_wheels/arqit-skaplatform-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-policy/ \
#     --find-links arqit_wheels/arqit-skaplatform-registration/ \
#     --find-links arqit_wheels/arqit-skaplatform-provisioning/ \
#     --find-links arqit_wheels/arqit-skaplatform-mqtt-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-peering/ \
#     --find-links arqit_wheels/arqit-skaplatform-monitoring/
# brotli>=1.2.0 overrides arqit-skaplatform-common's own exact pin
# (Brotli==1.1.0): that pin is just inherited conservatism — the SDK
# imports brotli in authentication.py but never calls it (confirmed by
# inspecting the wheel, no .compress/.decompress/.process call exists
# anywhere) — while openai's httpx2 client needs brotli>=1.2.0 for its
# Decompressor.process(data, output_buffer_limit=...) call. Without
# this floor, installing arqit_py alongside semantic-kernel/langchain
# in the same environment locks brotli at 1.1.0 and every OpenAI call
# that gets a brotli-compressed response (Cloudflare, by default)
# crashes with TypeError: process() takes no keyword arguments.
arqit_py = [
    "stls_core[arqit_py]",
    "brotli>=1.2.0",
]

# PQC provider — hybrid X25519 + ML-KEM-768. Pass-through to stls-core[pqc].
# Install: uv pip install -e ".[pqc]"
pqc = [
    "stls_core[pqc]",
]

# asyncpg for AgentRegistry (PostgresLoader-style multi-agent heartbeat/
# liveness tracking). Lazy, guarded import in stls_a2a_agent_registry.py —
# not needed for "import stls_a2a", only when AUTH_PG_DSN/registry are active.
# Install: uv pip install -e ".[postgres]"
postgres = [
    "stls_core[postgres]",
]

# Google ADK agent adapter (GoogleADKAdapter, ContextualRemoteA2aAgent/
# ContextualSecureRemoteA2aAgent's RemoteA2aAgent). Moved out of the
# mandatory dependencies (issue #65): the adapter modules already
# lazy-import these and raise a clear ImportError pointing at this exact
# extra if it's missing — `import stls_a2a` itself never needed them
# unconditionally once that lazy-import fix landed.
# opentelemetry-api/-sdk are bundled here, not left mandatory either —
# they exist in this dependency set only because google-adk uses them
# internally; stls_a2a's own code never imports opentelemetry directly.
# CEILING NOTE: google-adk 1.39.1 (the latest 1.x release as of this
# audit) itself declares `opentelemetry-api/-sdk>=1.36,<=1.41.1` in its
# own metadata (confirmed via `pip download` + wheel METADATA, not
# guesswork) — so even raising stls_a2a's own otel ceiling can never
# reach 1.45.1/1.45.2, where CVE-2026-114603/CVE-2026-126360 are
# actually fixed. That fix genuinely requires google-adk>=2.0 (a
# separate, higher-risk migration — ADK's 2.x async-runner rewrite is
# exactly what the google-adk<2.0 ceiling below still guards against;
# see e.g. still-open google/adk-python#3708/#3692 for the same class
# of OpenTelemetry-context-across-asyncio-task bug this codebase's
# ceiling was originally added for). Until that migration happens,
# these two CVEs are a known, documented, residual exposure for anyone
# using the google-adk extra — not a silent one.
# Install: uv pip install -e ".[google-adk]"
google-adk = [
    "google-adk[a2a]>=1.28.1,<2.0.0",
    "google-genai>=1.63.0",
    "opentelemetry-api>=1.35.0,<1.39.0",
    "opentelemetry-sdk>=1.35.0,<1.39.0",
]

# LangChain/LangGraph agent adapter (LangChainAdapter's isinstance checks
# against CompiledStateGraph/BaseChatModel, stls_a2a_utils.py's
# auto-detect dispatcher). Moved out of mandatory dependencies (issue
# #65) — LangChainAdapter itself never imports these packages (it
# duck-types against the agent instance's class name/module), so this
# extra only matters if the caller's OWN agent actually needs them.
# Install: uv pip install -e ".[langchain]"
langchain = [
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
]

# Install: uv pip install -e ".[langgraph]"
langgraph = [
    "langgraph>=1.2.2,<1.3.0",
]

# Semantic Kernel agent adapter (SemanticKernelAdapter). Moved out of
# mandatory dependencies (issue #65) — the adapter module already
# lazy-imports this and raises a clear ImportError pointing at this
# exact extra if it's missing.
# >=1.39.4 (issue #65): the 1.36.0 floor this used to carry was
# vulnerable to CVE-2026-25592 and CVE-2026-26030 — the latter a
# REMOTE CODE EXECUTION vulnerability, both fixed by 1.39.4.
# azure-ai-agents pinned exactly: semantic-kernel>=1.39.4 requires
# azure-ai-agents>=1.2.0b3, and EVERY azure-ai-agents release is a
# pre-release (no stable 1.x exists at all, confirmed against PyPI) —
# an exact pin lets the resolver satisfy it without needing
# --prerelease=allow globally, which otherwise lets unrelated
# packages (seen: authlib, redis) drift onto their own stray
# pre-releases too. `uv pip install` without --prerelease=allow still
# needs this exact pin to resolve; plain `pip install` has always
# been fine either way.
# Install: uv pip install -e ".[semantic-kernel]"
semantic-kernel = [
    "semantic-kernel>=1.39.4",
    "azure-ai-agents==1.2.0b6",
]

# All extras (excluding the Arqit wheels, which need --find-links).
all = [
    "yfinance>=1.2.0",
    "stls_core[redis]",
    "google-adk[a2a]>=1.28.1,<2.0.0",
    "google-genai>=1.63.0",
    "opentelemetry-api>=1.35.0,<1.39.0",
    "opentelemetry-sdk>=1.35.0,<1.39.0",
    "langchain>=1.3.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2,<1.3.0",
    "semantic-kernel>=1.39.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "WARNING"
# The tests/ directory also holds manual, real-infra integration
# scripts (servers, stress tests, multi-process scenarios — see
# tests/README.md) that intentionally don't match pytest's collection
# glob (test_*.py / *_test.py) — nothing to ignore here beyond that.

[tool.coverage.run]
source = ["src/stls_a2a"]
omit = ["tests/*"]

[tool.setuptools.packages.find]
where = ["src"]

# Resolves stls_core as a local package of the monorepo (path relative to
# this pyproject.toml, not to the uv command's working directory).
# In production, replace with the version published on a private index
# and remove this section.
[tool.uv.sources]
stls_core = { path = "../stls-core" }

# arqit-skaplatform-common==21.0.0 declares brotli==1.1.0 exactly, but
# never actually calls it (dead import in authentication.py, confirmed
# by inspecting the wheel) — the pin is just inherited conservatism.
# openai's httpx2 client needs brotli>=1.2.0 for its brotli decoder
# (Decompressor.process(data, output_buffer_limit=...)). Without this
# override, uv's resolver treats the two constraints as unsatisfiable
# whenever arqit_py and semantic-kernel/langchain are installed
# together; override-dependencies lets the explicit floor above win.
[tool.uv]
override-dependencies = ["brotli>=1.2.0"]