[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stls_a2a"
version = "0.1.6"
description = "SDK for building Agentic A2A comunication using quantum-safe encrypted channels"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    # Cryptography, session cache, handshake, key provider (base/arqit_py) and
    # API key auth now live in stls-core — shared with stls-mcp.
    # Resolved as a local package via [tool.uv.sources] below.
    "stls_core>=0.1.1",
    "fastapi>=0.129.0",
    # ADK 2.x introduces breaking changes in the async runner that cause
    # GeneratorExit / OpenTelemetry context detach errors. Tested with 1.26.0.
    "google-adk[a2a]>=1.25.0,<2.0.0",
    "google-genai>=1.63.0",
    "httpx>=0.28.1",
    # jwt==1.3.1 required by arqit-skaplatform-common and provisioning (JWT class).
    # PyJWT>=2.x required by mcp/msal (ADK transitive dependency).
    # Both must coexist: whichever jwt is installed last wins on the jwt module.
    "jwt==1.3.1",
    "PyJWT>=2.8.0,<3.0.0",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2,<1.3.0",
    # opentelemetry 1.39+ is incompatible with google-adk<2.0 in async
    # cancellation scenarios (Token created in a different Context).
    "opentelemetry-api>=1.35.0,<1.39.0",
    "opentelemetry-sdk>=1.35.0,<1.39.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.1",
    # Unconditional module-level import in stls_a2a_task.py (TaskStore),
    # used regardless of the chosen backend (TASK_STORE_BACKEND=memory|redis).
    # Without this entry "import stls_a2a" always fails on a clean venv,
    # even if the Redis backend is never used.
    "redis>=5.0",
    "semantic-kernel>=1.36.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
examples = [
    "yfinance>=1.2.0",
]

# Redis cache for ApiKeyManager (RedisKeyCache, BackgroundRefresher) and
# PostgresLoader. Pass-through to stls-core's extra of the same name.
# Install:  uv pip install -e ".[redis]"
redis = [
    "stls_core[redis]",
]

# Arqit SKA-Platform™ Python SDK (local wheels in arqit_wheels/).
# Pass-through to stls-core's extra of the same name — the arqit_py
# provider lives entirely in stls-core, this just propagates the extra.
# Install:
#   uv pip install -e ".[arqit_py]" \
#     --find-links arqit_wheels/arqit-skaplatform-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-policy/ \
#     --find-links arqit_wheels/arqit-skaplatform-registration/ \
#     --find-links arqit_wheels/arqit-skaplatform-provisioning/ \
#     --find-links arqit_wheels/arqit-skaplatform-mqtt-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-peering/ \
#     --find-links arqit_wheels/arqit-skaplatform-monitoring/
arqit_py = [
    "stls_core[arqit_py]",
]

# PQC provider — hybrid X25519 + ML-KEM-768. Pass-through to stls-core[pqc].
# Install: uv pip install -e ".[pqc]"
pqc = [
    "stls_core[pqc]",
]

# asyncpg for AgentRegistry (PostgresLoader-style multi-agent heartbeat/
# liveness tracking). Lazy, guarded import in stls_a2a_agent_registry.py —
# not needed for "import stls_a2a", only when AUTH_PG_DSN/registry are active.
# Install: uv pip install -e ".[postgres]"
postgres = [
    "stls_core[postgres]",
]

# All extras (excluding the Arqit wheels, which need --find-links).
all = [
    "yfinance>=1.2.0",
    "stls_core[redis]",
]

[tool.setuptools.packages.find]
where = ["src"]

# Resolves stls_core as a local package of the monorepo (path relative to
# this pyproject.toml, not to the uv command's working directory).
# In production, replace with the version published on a private index
# and remove this section.
[tool.uv.sources]
stls_core = { path = "../stls-core" }