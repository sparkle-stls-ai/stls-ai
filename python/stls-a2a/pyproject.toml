[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stls_a2a"
version = "0.1.5"
description = "SDK for building Agentic A2A comunication using quantum-safe encrypted channels"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Crittografia, session cache, handshake, key provider (base/arqit_py) e
    # API key auth ora vivono in stls-core — condiviso con stls-mcp.
    # Risolto come pacchetto locale via [tool.uv.sources] sotto.
    "stls_core>=0.1.1",
    "fastapi>=0.129.0",
    # ADK 2.x introduce breaking changes nel runner asincrono che causano
    # GeneratorExit / OpenTelemetry context detach errors. Testato con 1.26.0.
    "google-adk[a2a]>=1.25.0,<2.0.0",
    "google-genai>=1.63.0",
    "httpx>=0.28.1",
    # jwt==1.3.1 richiesto da arqit-skaplatform-common e provisioning (classe JWT).
    # PyJWT>=2.x richiesto da mcp/msal (dipendenza transitiva ADK).
    # Entrambi devono coesistere: jwt installato per ultimo vince sul modulo jwt.
    "jwt==1.3.1",
    "PyJWT>=2.8.0,<3.0.0",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2,<1.3.0",
    # opentelemetry 1.39+ è incompatibile con google-adk<2.0 in scenari
    # di cancellazione asincrona (Token created in a different Context).
    "opentelemetry-api>=1.35.0,<1.39.0",
    "opentelemetry-sdk>=1.35.0,<1.39.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.1",
    # Import incondizionato a livello di modulo in stls_a2a_task.py (TaskStore),
    # usato indipendentemente dal backend scelto (TASK_STORE_BACKEND=memory|redis).
    # Senza questa voce "import stls_a2a" fallisce sempre con una venv pulita,
    # anche se non si usa mai il backend Redis.
    "redis>=5.0",
    "semantic-kernel>=1.36.0",
    "uvicorn>=0.40.0",
]

[project.optional-dependencies]
examples = [
    "yfinance>=1.2.0",
]

# Cache Redis per ApiKeyManager (RedisKeyCache, BackgroundRefresher) e
# PostgresLoader. Pass-through verso l'extra omonimo di stls-core.
# Installazione:  uv pip install -e ".[redis]"
redis = [
    "stls_core[redis]",
]

# Arqit SKA-Platform™ Python SDK (wheel locali in arqit_wheels/).
# Pass-through verso l'extra omonimo di stls-core — il provider arqit_py
# vive interamente in stls-core, qui serve solo a propagare l'extra.
# Installazione:
#   uv pip install -e ".[arqit_py]" \
#     --find-links arqit_wheels/arqit-skaplatform-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-policy/ \
#     --find-links arqit_wheels/arqit-skaplatform-registration/ \
#     --find-links arqit_wheels/arqit-skaplatform-provisioning/ \
#     --find-links arqit_wheels/arqit-skaplatform-mqtt-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-peering/ \
#     --find-links arqit_wheels/arqit-skaplatform-monitoring/
arqit_py = [
    "stls_core[arqit_py]",
]

# Provider PQC — ibrido X25519 + ML-KEM-768. Pass-through verso stls-core[pqc].
# Installazione: uv pip install -e ".[pqc]"
pqc = [
    "stls_core[pqc]",
]

# asyncpg per AgentRegistry (PostgresLoader-style heartbeat/liveness tracking
# multi-agente). Import lazy e guardato in stls_a2a_agent_registry.py — non
# serve per "import stls_a2a", solo quando AUTH_PG_DSN/registry sono attivi.
# Installazione: uv pip install -e ".[postgres]"
postgres = [
    "stls_core[postgres]",
]

# Tutti gli extra (esclusi i wheel Arqit che richiedono --find-links).
all = [
    "yfinance>=1.2.0",
    "stls_core[redis]",
]

[tool.setuptools.packages.find]
where = ["src"]

# Risolve stls_core come pacchetto locale del monorepo (path relativo a
# questo pyproject.toml, non alla working directory del comando uv).
# In produzione, sostituire con la versione pubblicata su un index privato
# e rimuovere questa sezione.
[tool.uv.sources]
stls_core = { path = "../stls-core" }