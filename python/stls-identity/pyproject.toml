[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stls-identity"
version = "0.1.0"
description = "DID + Verifiable Credential identity layer for the STLS AI ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "stls_core>=0.1.1",
    "pydantic>=2",
    "cryptography>=42",
    "base58>=2.1",
    "redis>=5.0",
    "fastapi>=0.110",
    "rfc8785>=0.1.4",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Resolves stls_core as a local package of the monorepo (path relative to
# this pyproject.toml). In production, replace with the version published
# on a private index and remove this section.
#
# Used for: stls_core.auth (AuditEntry, AuthResult, default_audit_hook) —
# issuer.py writes VC issuance/revocation to the same audit stream as
# ApiKeyManager. NOT used for the keystore (see keystore.py: ArqitKeyStoreBase
# has the wrong TTL/ephemeral semantics for a persistent signing key).
[tool.uv.sources]
stls_core = { path = "../stls-core" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src/stls_identity"]
omit = ["tests/*"]