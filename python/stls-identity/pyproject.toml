[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stls-identity"
version = "0.1.0"
description = "DID + Verifiable Credential identity layer for the STLS AI ecosystem"
requires-python = ">=3.12"
dependencies = [
    "stls_core>=0.1.1",
    "pydantic>=2",
    "cryptography>=42",
    "base58>=2.1",
    "redis>=5.0",
    "fastapi>=0.110",
    "rfc8785>=0.1.4",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Risolve stls_core come pacchetto locale del monorepo (path relativo a
# questo pyproject.toml). In produzione, sostituire con la versione
# pubblicata su un index privato e rimuovere questa sezione.
#
# Usato per: stls_core.auth (AuditEntry, AuthResult, default_audit_hook) —
# issuer.py scrive le VC issuance/revocation nello stesso audit stream di
# ApiKeyManager. NON usato per il keystore (vedi keystore.py: ArqitKeyStoreBase
# ha semantica TTL/ephemeral sbagliata per una chiave di firma persistente).
[tool.uv.sources]
stls_core = { path = "../stls-core" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src/stls_identity"]
omit = ["tests/*"]