[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stls_core"
version = "0.1.5"
description = "Core cryptographic transport layer for STLS — protocol-agnostic symmetric encryption, quantum-safe key providers and API key auth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    # Crypto primitives: AES-256-GCM, HMAC-SHA256, HKDF-Expand
    "cryptography>=46.0.5",
    # KeyRecord / HandshakeRequest / HandshakeResponse Pydantic models
    "pydantic>=2.0.0",
    # Env var loading (.env support in providers)
    "python-dotenv>=1.2.1",
    # Client-side STLS handshake (stls_core_client_handshake.py:
    # perform_client_handshake()/perform_pqc_client_handshake(), used by
    # establish_session()/resolve_transport()) — moved here from
    # stls-mcp as part of issue #5, "Restrict stls-core's public API
    # surface". A real runtime dependency now, not just a test-only one.
    "httpx>=0.28.1",
]

[project.optional-dependencies]

# Redis cache for ApiKeyManager (RedisKeyCache, BackgroundRefresher).
# Install:  uv pip install -e ".[redis]"
redis = [
    "redis>=7.4.0",
]

# PostgresLoader (stls_core.auth) — AUTH_LOADER_BACKEND=postgres backend
# for ApiKeyManager. Separate from [redis]: these are two independent
# backends (session/key cache vs. key data source), no reason installing
# one should pull in the other. Before this change asyncpg lived
# (by mistake) inside [redis] — anyone who relied on that behavior
# (uv pip install -e ".[redis]" to also get asyncpg) must now
# explicitly add [postgres] too, e.g.
# uv pip install -e ".[redis,postgres]".
# Install:  uv pip install -e ".[postgres]"
postgres = [
    "asyncpg>=0.31.0",
]

# Arqit SKA-Platform™ Python SDK (local wheels in arqit_wheels/).
# Install:
#   uv pip install -e ".[arqit_py]" \
#     --find-links arqit_wheels/arqit-skaplatform-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-policy/ \
#     --find-links arqit_wheels/arqit-skaplatform-registration/ \
#     --find-links arqit_wheels/arqit-skaplatform-provisioning/ \
#     --find-links arqit_wheels/arqit-skaplatform-mqtt-common/ \
#     --find-links arqit_wheels/arqit-skaplatform-peering/ \
#     --find-links arqit_wheels/arqit-skaplatform-monitoring/
arqit_py = [
    "arqit-skaplatform-common",
    "arqit-skaplatform-policy",
    "arqit-skaplatform-registration",
    "arqit-skaplatform-provisioning",
    "arqit-skaplatform-mqtt-common",
    "arqit-skaplatform-peering",
    "arqit-skaplatform-monitoring",
]

# PQC provider — hybrid X25519 + ML-KEM-768 (NIST FIPS 203).
# Quantum-safe with no dependency on external services (Arqit not required).
# liboqs-python bundles compiled liboqs (C library): requires build tools
# or pre-built wheels available on PyPI for the main platforms.
# Install: uv pip install -e ".[pqc]"
pqc = [
    # Must match the version of the liboqs C library installed on the
    # system (/usr/local/lib/liboqs.so.*). A version mismatch between
    # the C library and the Python wrapper causes an AttributeError at runtime.
    # Check the C library version: strings /usr/local/lib/liboqs.so.* | grep "^0\."
    # Install: uv pip install -e ".[pqc]"
    "liboqs-python>=0.14.1",
]

# Development and test dependencies.
# fastapi/uvicorn are only needed for the over-the-wire E2E test
# (test_e2e_client_server.py) — not runtime dependencies of the package.
# httpx moved to [project.dependencies] above (issue #5).
# Install:  uv pip install -e ".[dev]"
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "fastapi>=0.129.0",
    "uvicorn>=0.40.0",
    # Fake Redis for the Redis keystore tests, no real server needed.
    # Supports GETEX, ZRANGEBYSCORE, pipeline — covers all of RedisArqitKeyStore.
    "fakeredis>=2.23.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "WARNING"

[tool.coverage.run]
source = ["src/stls_core"]
omit = ["tests/*"]