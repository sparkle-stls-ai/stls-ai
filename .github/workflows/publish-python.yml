name: Publish Python packages

# Builds and publishes a package to PyPI only when its pyproject.toml
# version differs from the version currently live on PyPI — bumping the
# version *is* the release trigger. Forget to bump and this workflow is a
# silent no-op; PyPI itself refuses a re-upload of an existing version, so
# this check only avoids an always-failing publish attempt instead of
# changing what actually gets shipped.
#
# Test gate (issue #56): a changed-version package's own test suite must
# pass before it is built and published — a plain `if:` condition implies
# success() of earlier steps, so a failing "Run tests" step here already
# skips Build/Publish/Tag without any extra wiring. Scoped, per #56, to
# each package's fast, no-external-infra tests only — a handful of
# stls-identity tests need a real Postgres/Redis (test_bridge.py,
# test_keystore_redis.py, test_postgres_store.py, test_status_list_redis.py,
# test_trust_registry.py) and are --ignore'd here; a slower infra-backed
# gate is out of scope for this issue (see #57).
#
# stls-a2a (issue #59, closed): tests/ used to be all manual, real-infra
# integration scripts using print/bool instead of assert, so pytest would
# "pass" them even on a real failure. Converted to a real assert-based
# pytest suite that mocks out real infra by default (in-memory TaskStore,
# a MockAgent, monkeypatched ADK runners) and renamed every genuinely
# manual script out of pytest's collection glob (*_manual.py) — see
# python/stls-a2a/tests/README.md. No --ignore needed: the whole
# collectible suite is infra-free.
#
# This same test step (minus build/publish/tag) also runs on every push
# and PR via python-tests.yml (issue #57), independent of a version bump.
on:
  push:
    branches: [main]
    paths:
      - "python/stls-core/**"
      - "python/stls-a2a/**"
      - "python/stls-identity/**"
      - "python/stls-mcp/**"
      - ".github/workflows/publish-python.yml"

permissions:
  contents: write # to push the release tag
  id-token: write # PyPI trusted publishing (OIDC) — see repo setup notes

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: python/stls-core
            dist_name: stls_core
            pypi_environment: pypi-stls-core
            run_tests: true
            test_args: ""
          - dir: python/stls-a2a
            dist_name: stls_a2a
            pypi_environment: pypi-stls-a2a
            run_tests: true
            test_args: ""
          - dir: python/stls-identity
            dist_name: stls-identity
            pypi_environment: pypi-stls-identity
            run_tests: true
            # Excluded: need a real Postgres/Redis, out of scope for this
            # no-infra gate (#56) — see #57 for a future infra-backed one.
            test_args: >-
              --ignore=tests/test_bridge.py
              --ignore=tests/test_keystore_redis.py
              --ignore=tests/test_postgres_store.py
              --ignore=tests/test_status_list_redis.py
              --ignore=tests/test_trust_registry.py
          - dir: python/stls-mcp
            dist_name: stls_mcp
            pypi_environment: pypi-stls-mcp
            run_tests: true
            test_args: ""
    # Must match the PyPI project's configured Trusted Publisher
    # environment name (one-time setup per project on pypi.org). PyPI
    # requires the (owner, repo, workflow file, environment) tuple to be
    # unique per project — since all four packages share this same
    # workflow file, each needs its own environment name here, or the
    # second project's pending-publisher registration collides with the
    # first's.
    environment:
      name: ${{ matrix.pypi_environment }}
      url: https://pypi.org/project/${{ matrix.dist_name }}/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check whether this package's version changed
        id: version
        working-directory: ${{ matrix.dir }}
        run: |
          python - "${{ matrix.dist_name }}" <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import sys
          import tomllib
          import urllib.error
          import urllib.request

          dist_name = sys.argv[1]
          local_version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]

          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{dist_name}/json") as r:
                  published_version = json.load(r)["info"]["version"]
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              published_version = ""  # package never published

          print(f"local={local_version}")
          print(f"changed={'true' if local_version != published_version else 'false'}")
          EOF

      - name: Install dev dependencies
        if: steps.version.outputs.changed == 'true' && matrix.run_tests
        working-directory: ${{ matrix.dir }}
        run: pip install -e ".[dev]"

      - name: Run tests
        if: steps.version.outputs.changed == 'true' && matrix.run_tests
        working-directory: ${{ matrix.dir }}
        run: pytest ${{ matrix.test_args }}

      - name: Build sdist and wheel
        if: steps.version.outputs.changed == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.dir }}/dist

      - name: Tag the release
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="${{ matrix.dist_name }}-py-v${{ steps.version.outputs.local }}"
          git tag "$tag"
          git push origin "$tag"
