name: Publish Node packages

# Same trigger convention as publish-python.yml: a package is only built
# and published when its package.json version differs from the version
# currently live on npm. Bumping the version is the release trigger; an
# unchanged version is a silent no-op.
#
# Same race as publish-python.yml's own note (found there 2026-11-27 from
# a real failure): two commits touching the same package close together
# can each trigger their own run, both read the registry before either
# has published, and both decide changed=true. The losing run's `npm
# publish` and tag push are each wrapped below to treat "this exact
# version/tag already exists" as a benign no-op instead of a failure —
# npm has no built-in skip-existing equivalent to pypa/gh-action-pypi-
# publish's, so this checks for that specific case by hand rather than
# swallowing every publish error.
#
# stls-mcp and stls-identity both depend on stls-core via
# "file:../stls-core" in their committed package.json, so that local
# dev and the interop CI always exercise the sibling package's current
# working-tree state rather than whatever is already on npm. That path
# has no meaning on a consumer's machine, so each dependent job
# rewrites it to a real semver range on its checked-out copy only,
# right before publishing — never committed back. This is why each
# depends (needs:) on publish-stls-core: so it picks up a same-push
# stls-core version bump instead of racing it. stls-identity does NOT
# depend on stls-mcp, so its job runs in parallel with
# publish-stls-mcp, not after it.
#
# Test gate (issue #56): each job runs `npm test` (its package.json's own,
# no-external-infra-required smoke tests) before Build/Publish/Tag. A
# plain `if:` condition implies success() of earlier steps, so a failing
# "Run tests" step here already skips the rest without extra wiring.
# stls-core's auth/session smoke tests and stls-identity's keystore/
# credential-cache/status smoke tests each need a real Redis (fakeredis
# has no Node equivalent in this codebase), hence the service container
# in those two jobs; stls-mcp's single smoke test is self-contained.
# Cross-language interop tests and anything needing real Postgres/Arqit
# credentials stay out of this gate (see #57 for a possible future
# infra-backed one).
on:
  push:
    branches: [main]
    paths:
      - "node/stls-core/**"
      - "node/stls-mcp/**"
      - "node/stls-identity/**"
      - ".github/workflows/publish-node.yml"

permissions:
  contents: write # to push the release tag
  id-token: write # npm provenance attestation

jobs:
  publish-stls-core:
    runs-on: ubuntu-latest
    # Must match the npm Trusted Publisher's configured environment name
    # (one-time setup per package on npmjs.com).
    environment:
      name: npm-stls-core
    # Only for the test gate's auth/session smoke tests (TEST_REDIS_URL
    # below) — same port convention as stls-core-node-interop.yml.
    services:
      redis:
        image: redis:7
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6399
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) needs npm >=11.5.1; the version
      # bundled with actions/setup-node's Node 20 is older. Pinned to the
      # 11.x line, not "latest" — npm 12 requires Node >=22, which this
      # Node 20 runner doesn't satisfy.
      - name: Update npm for OIDC Trusted Publishing support
        run: npm install -g npm@11

      - name: Check whether this package's version changed
        id: version
        working-directory: node/stls-core
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view stls-core version 2>/dev/null || echo "")
          echo "local=$local_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and build
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-core
        run: |
          npm install
          npm run build

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-core
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-core
        run: |
          npm publish --provenance --access public || {
            published=$(npm view "stls-core@${{ steps.version.outputs.local }}" version 2>/dev/null || echo "")
            if [ "$published" = "${{ steps.version.outputs.local }}" ]; then
              echo "stls-core@${{ steps.version.outputs.local }} already published by a concurrent run — not fatal."
            else
              exit 1
            fi
          }

      - name: Tag the release
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="stls-core-node-v${{ steps.version.outputs.local }}"
          git tag "$tag"
          git push origin "$tag" || {
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "Tag $tag already exists on origin (published by a concurrent run) — not fatal."
            else
              exit 1
            fi
          }

  publish-stls-mcp:
    needs: publish-stls-core
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Must match the npm Trusted Publisher's configured environment name
    # (one-time setup per package on npmjs.com).
    environment:
      name: npm-stls-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) needs npm >=11.5.1; the version
      # bundled with actions/setup-node's Node 20 is older. Pinned to the
      # 11.x line, not "latest" — npm 12 requires Node >=22, which this
      # Node 20 runner doesn't satisfy.
      - name: Update npm for OIDC Trusted Publishing support
        run: npm install -g npm@11

      - name: Check whether this package's version changed
        id: version
        working-directory: node/stls-mcp
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view stls-mcp version 2>/dev/null || echo "")
          echo "local=$local_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point at the published stls-core before building
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-mcp
        run: |
          # The version we actually just (or previously) published in the
          # sibling job — not just "whatever npm view returns" (see below).
          expected_version=$(node -p "require('../stls-core/package.json').version")
          core_version=""
          for i in $(seq 1 30); do
            seen_version=$(npm view stls-core version 2>/dev/null || echo "")
            if [ "$seen_version" != "$expected_version" ]; then
              # A stale read here is NOT "not visible yet" — npm's registry
              # has a real post-publish propagation delay across edge nodes,
              # during which `npm view` can keep returning the PREVIOUS
              # published version for a while instead of erroring or coming
              # back empty. Checking only for a non-empty response (as this
              # loop used to) accepts that stale read as success on the
              # first try, pinning stls-mcp to the old stls-core release
              # (observed: pinned ^0.1.4 right after publishing stls-core
              # 0.1.5, because 0.1.4 was still what the registry handed back
              # moments after the publish). Looping until the version
              # actually matches what this run published closes that race.
              echo "stls-core $expected_version not visible on the registry yet (saw '${seen_version:-<empty>}'), retrying in 10s..."
              sleep 10
              continue
            fi
            # Metadata (what npm view reads) and the tarball blob (what
            # `npm install` actually fetches) are not propagated
            # atomically — observed directly: npm view already reported
            # the new version while the tarball URL still 404'd for
            # several minutes afterwards. Checking the version string
            # alone (as this loop used to) made "Install and build" race
            # the tarball's own propagation and fail with a 404 on
            # stls-core-<version>.tgz even though this check had just
            # passed. HEAD the actual tarball URL too, not just the
            # version metadata.
            tarball_url=$(npm view "stls-core@$expected_version" dist.tarball 2>/dev/null || echo "")
            if [ -n "$tarball_url" ] && curl -o /dev/null -sf --head "$tarball_url"; then
              core_version="$seen_version"
              break
            fi
            echo "stls-core $expected_version visible but its tarball isn't fetchable yet, retrying in 10s..."
            sleep 10
          done
          if [ -z "$core_version" ]; then
            echo "::error::stls-core $expected_version never became fully available (version + tarball) on the registry (npm propagation delay?)"
            exit 1
          fi
          echo "Pinning stls-core to ^$core_version"
          npm pkg set "dependencies.stls-core=^$core_version"
          # package-lock.json still has the old "file:../stls-core" entry
          # resolved to "../stls-core" — and that path genuinely exists in
          # this monorepo checkout (just unbuilt, since this job never runs
          # node/stls-core's own build). Left in place, npm keeps trusting
          # that stale local resolution instead of fetching the version we
          # just pinned above. Deleting it here (this checkout's copy only,
          # never committed back) forces a full re-resolve from the
          # package.json we just rewrote.
          rm -f package-lock.json

      - name: Install and build
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-mcp
        run: |
          npm install
          ls node_modules/stls-core/dist/index.js
          npm run build

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-mcp
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-mcp
        run: |
          npm publish --provenance --access public || {
            published=$(npm view "stls-mcp@${{ steps.version.outputs.local }}" version 2>/dev/null || echo "")
            if [ "$published" = "${{ steps.version.outputs.local }}" ]; then
              echo "stls-mcp@${{ steps.version.outputs.local }} already published by a concurrent run — not fatal."
            else
              exit 1
            fi
          }

      - name: Tag the release
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="stls-mcp-node-v${{ steps.version.outputs.local }}"
          git tag "$tag"
          git push origin "$tag" || {
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "Tag $tag already exists on origin (published by a concurrent run) — not fatal."
            else
              exit 1
            fi
          }

  publish-stls-identity:
    needs: publish-stls-core
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Must match the npm Trusted Publisher's configured environment name
    # (one-time setup per package on npmjs.com).
    environment:
      name: npm-stls-identity
    # Only for the test gate's keystore/credential-cache/status smoke
    # tests (TEST_REDIS_URL below) — same port convention as
    # stls-core-node-interop.yml and this file's own publish-stls-core job.
    services:
      redis:
        image: redis:7
        ports:
          - 6399:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6399
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) needs npm >=11.5.1; the version
      # bundled with actions/setup-node's Node 20 is older. Pinned to the
      # 11.x line, not "latest" — npm 12 requires Node >=22, which this
      # Node 20 runner doesn't satisfy.
      - name: Update npm for OIDC Trusted Publishing support
        run: npm install -g npm@11

      - name: Check whether this package's version changed
        id: version
        working-directory: node/stls-identity
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view stls-identity version 2>/dev/null || echo "")
          echo "local=$local_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point at the published stls-core before building
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-identity
        run: |
          # Same wait-for-propagation loop as stls-mcp's own job above —
          # see its comments for why both the version AND the tarball
          # must be checked, not just a non-empty `npm view` response.
          expected_version=$(node -p "require('../stls-core/package.json').version")
          core_version=""
          for i in $(seq 1 30); do
            seen_version=$(npm view stls-core version 2>/dev/null || echo "")
            if [ "$seen_version" != "$expected_version" ]; then
              echo "stls-core $expected_version not visible on the registry yet (saw '${seen_version:-<empty>}'), retrying in 10s..."
              sleep 10
              continue
            fi
            tarball_url=$(npm view "stls-core@$expected_version" dist.tarball 2>/dev/null || echo "")
            if [ -n "$tarball_url" ] && curl -o /dev/null -sf --head "$tarball_url"; then
              core_version="$seen_version"
              break
            fi
            echo "stls-core $expected_version visible but its tarball isn't fetchable yet, retrying in 10s..."
            sleep 10
          done
          if [ -z "$core_version" ]; then
            echo "::error::stls-core $expected_version never became fully available (version + tarball) on the registry (npm propagation delay?)"
            exit 1
          fi
          echo "Pinning stls-core to ^$core_version"
          npm pkg set "dependencies.stls-core=^$core_version"
          # Same reasoning as stls-mcp's own job: force a full re-resolve
          # from the package.json we just rewrote, this checkout's copy
          # only, never committed back.
          rm -f package-lock.json

      - name: Install and build
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-identity
        run: |
          npm install
          ls node_modules/stls-core/dist/index.js
          npm run build

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-identity
        run: npm test

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-identity
        run: |
          npm publish --provenance --access public || {
            published=$(npm view "stls-identity@${{ steps.version.outputs.local }}" version 2>/dev/null || echo "")
            if [ "$published" = "${{ steps.version.outputs.local }}" ]; then
              echo "stls-identity@${{ steps.version.outputs.local }} already published by a concurrent run — not fatal."
            else
              exit 1
            fi
          }

      - name: Tag the release
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="stls-identity-node-v${{ steps.version.outputs.local }}"
          git tag "$tag"
          git push origin "$tag" || {
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "Tag $tag already exists on origin (published by a concurrent run) — not fatal."
            else
              exit 1
            fi
          }
