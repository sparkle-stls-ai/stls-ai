name: Publish Node packages

# Same trigger convention as publish-python.yml: a package is only built
# and published when its package.json version differs from the version
# currently live on npm. Bumping the version is the release trigger; an
# unchanged version is a silent no-op.
#
# stls-mcp depends on stls-core via "file:../stls-core" in the committed
# package.json, so that local dev and the interop CI always exercise the
# sibling package's current working-tree state rather than whatever is
# already on npm. That path has no meaning on a consumer's machine, so
# the stls-mcp job rewrites it to a real semver range on its checked-out
# copy only, right before publishing — never committed back. This is why
# stls-mcp's job runs after (needs:) stls-core's: so it picks up a
# same-push stls-core version bump instead of racing it.
on:
  push:
    branches: [main]
    paths:
      - "node/stls-core/**"
      - "node/stls-mcp/**"
      - ".github/workflows/publish-node.yml"

permissions:
  contents: write # to push the release tag
  id-token: write # npm provenance attestation

jobs:
  publish-stls-core:
    runs-on: ubuntu-latest
    # Must match the npm Trusted Publisher's configured environment name
    # (one-time setup per package on npmjs.com).
    environment:
      name: npm-stls-core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) needs npm >=11.5.1; the version
      # bundled with actions/setup-node's Node 20 is older.
      - name: Update npm for OIDC Trusted Publishing support
        run: npm install -g npm@latest

      - name: Check whether this package's version changed
        id: version
        working-directory: node/stls-core
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view stls-core version 2>/dev/null || echo "")
          echo "local=$local_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and build
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-core
        run: |
          npm install
          npm run build

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-core
        run: npm publish --provenance --access public

      - name: Tag the release
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="stls-core-node-v${{ steps.version.outputs.local }}"
          git tag "$tag"
          git push origin "$tag"

  publish-stls-mcp:
    needs: publish-stls-core
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Must match the npm Trusted Publisher's configured environment name
    # (one-time setup per package on npmjs.com).
    environment:
      name: npm-stls-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing (OIDC) needs npm >=11.5.1; the version
      # bundled with actions/setup-node's Node 20 is older.
      - name: Update npm for OIDC Trusted Publishing support
        run: npm install -g npm@latest

      - name: Check whether this package's version changed
        id: version
        working-directory: node/stls-mcp
        run: |
          local_version=$(node -p "require('./package.json').version")
          published_version=$(npm view stls-mcp version 2>/dev/null || echo "")
          echo "local=$local_version" >> "$GITHUB_OUTPUT"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Point at the published stls-core before building
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-mcp
        run: |
          core_version=""
          for i in 1 2 3 4 5; do
            core_version=$(npm view stls-core version 2>/dev/null || echo "")
            [ -n "$core_version" ] && break
            echo "stls-core not visible on the registry yet, retrying in 10s..."
            sleep 10
          done
          if [ -z "$core_version" ]; then
            echo "::error::Could not resolve a published stls-core version from the registry"
            exit 1
          fi
          echo "Pinning stls-core to ^$core_version"
          npm pkg set "dependencies.stls-core=^$core_version"
          # package-lock.json still has the old "file:../stls-core" entry
          # resolved to "../stls-core" — and that path genuinely exists in
          # this monorepo checkout (just unbuilt, since this job never runs
          # node/stls-core's own build). Left in place, npm keeps trusting
          # that stale local resolution instead of fetching the version we
          # just pinned above. Deleting it here (this checkout's copy only,
          # never committed back) forces a full re-resolve from the
          # package.json we just rewrote.
          rm -f package-lock.json

      - name: Install and build
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-mcp
        run: |
          npm install
          ls node_modules/stls-core/dist/index.js
          npm run build

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        working-directory: node/stls-mcp
        run: npm publish --provenance --access public

      - name: Tag the release
        if: steps.version.outputs.changed == 'true'
        run: |
          tag="stls-mcp-node-v${{ steps.version.outputs.local }}"
          git tag "$tag"
          git push origin "$tag"
